<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/icon.png?v=3" />
    <link rel="apple-touch-icon" href="/icon.png?v=3" />

    <title>GEN+AI · AI Interview Readiness Reports</title>
    <meta
      name="description"
      content="GEN+AI turns your resume and a job description into a personalised interview readiness report with a match score, skill analysis, tailored questions, and a focused preparation plan."
    />
    <meta name="theme-color" content="#ecebe7" />
    <meta name="color-scheme" content="light" />

    <meta
      property="og:title"
      content="GEN+AI · AI Interview Readiness Reports"
    />
    <meta
      property="og:description"
      content="Turn your resume and a job description into a personalised interview readiness report."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </body>
</html>
